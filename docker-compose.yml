version: '3.8'

services:
  # ========================================================
  # Database & Vector Engine (PostgreSQL 16 + pgvector)
  # ========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartpc-postgres
    restart: always
    environment:
      POSTGRES_DB: smartpc_db
      POSTGRES_USER: smartpc_user
      POSTGRES_PASSWORD: smartpc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpc_user -d smartpc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # In-Memory Cache (Redis 7)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: smartpc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Local Email Testing Server (Mailhog)
  # ========================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartpc-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: always

  # ========================================================
  # Core Backend (Spring Boot 3 + Java 21)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartpc_db
      DB_USER: smartpc_user
      DB_PASSWORD: smartpc_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy_key_for_dev}
      JWT_SECRET: ${JWT_SECRET:-9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b}

  # ========================================================
  # Frontend Web Client (React 18 + Nginx)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  redis-data:
