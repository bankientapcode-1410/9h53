version: '3.8'

services:
  # ========================================================
  # Database Engine (MySQL 8.0)
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: smartpc-mysql
    restart: always
    environment:
      MYSQL_DATABASE: smartpc_db
      MYSQL_USER: smartpc_user
      MYSQL_PASSWORD: smartpc_password
      MYSQL_ROOT_PASSWORD: smartpc_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "smartpc_user", "-psmartpc_password"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # In-Memory Cache (Redis 7)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: smartpc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Local Email Testing Server (Mailhog)
  # ========================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartpc-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: always

  # ========================================================
  # Core Backend (Spring Boot 3.5 + Java 21)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpc-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smartpc_db
      DB_USER: smartpc_user
      DB_PASSWORD: smartpc_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy_key_for_dev}
      JWT_SECRET: ${JWT_SECRET:-9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b}

  # ========================================================
  # Frontend Web Client (React 18 + Nginx)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
  redis-data:
